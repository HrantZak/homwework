name: Build Uspevai IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project Uspevai.xcodeproj -scheme Uspevai -sdk iphoneos -configuration Release -derivedDataPath $RUNNER_TEMP/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p "$RUNNER_TEMP/UnsignedIPA/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Uspevai.app" "$RUNNER_TEMP/UnsignedIPA/Payload/"
          cd "$RUNNER_TEMP/UnsignedIPA"
          zip -qry "$RUNNER_TEMP/Uspevai-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Uspevai-unsigned-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/Uspevai-unsigned.ipa
          if-no-files-found: error
      - name: Import signing certificate
        if: env.CERTIFICATE_BASE64 != '' && env.PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != ''
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin env:P12_PASSWORD -noout >/dev/null 2>&1; then
            echo "Certificate is not a valid P12 file or APPLE_CERTIFICATE_PASSWORD is incorrect."
            exit 1
          fi
          if [ ! -s "$PP_PATH" ]; then
            echo "APPLE_PROVISION_PROFILE_BASE64 did not produce a valid file."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive
        if: env.CERTIFICATE_BASE64 != '' && env.PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != ''
        run: xcodebuild -project Uspevai.xcodeproj -scheme Uspevai -configuration Release -archivePath $RUNNER_TEMP/Uspevai.xcarchive archive
      - name: Export IPA
        if: env.CERTIFICATE_BASE64 != '' && env.PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != ''
        run: xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Uspevai.xcarchive -exportPath $RUNNER_TEMP/export -exportOptionsPlist ExportOptions.plist
      - uses: actions/upload-artifact@v4
        if: env.CERTIFICATE_BASE64 != '' && env.PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != ''
        with:
          name: Uspevai-IPA
          path: ${{ runner.temp }}/export/*.ipa
