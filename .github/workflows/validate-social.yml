name: Validate friends and chat rules
on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'Tests/firebase/**'
      - '.github/workflows/validate-social.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'Tests/firebase/**'
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: Tests/firebase
      - run: npm test
        working-directory: Tests/firebase
